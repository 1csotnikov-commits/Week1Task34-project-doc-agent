[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-doc-agent"
version = "0.1.0"
description = "CLI-агент для сборки документации проекта из DOCX/MD/TXT в Markdown для Obsidian и RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "project-doc-agent contributors" }]
keywords = ["documentation", "docx", "markdown", "obsidian", "rag", "llm", "cli"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/1csotnikov-commits/Week1Task34-project-doc-agent"
Repository = "https://github.com/1csotnikov-commits/Week1Task34-project-doc-agent"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
docagent = "project_doc_agent.cli:app"

[tool.setuptools]
packages = [
    "project_doc_agent",
    "project_doc_agent.ingest",
    "project_doc_agent.index",
    "project_doc_agent.tools",
    "project_doc_agent.agent",
    "project_doc_agent.extract",
    "project_doc_agent.render",
    "project_doc_agent.providers",
    "project_doc_agent.validation",
    "project_doc_agent.runs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:project_doc_agent.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP045"]

[tool.ruff.lint.per-file-ignores]
"project_doc_agent/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
files = ["project_doc_agent"]
